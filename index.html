<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Home Call - Panggil</title>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080b12;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .app {
      max-width: 500px;
      margin: auto;
      padding: 25px 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .card {
      background: #111722;
      border: 1px solid #202938;
      border-radius: 22px;
      padding: 25px;
      margin-top: 25px;
    }

    .icon {
      font-size: 70px;
      text-align: center;
      margin: 20px;
    }

    button {
      width: 100%;
      padding: 17px;
      border: 0;
      border-radius: 15px;
      margin-top: 15px;
      font-size: 17px;
      font-weight: bold;
    }

    .blue {
      background: #2563eb;
      color: white;
    }

    .red {
      background: #dc2626;
      color: white;
    }

    video {
      width: 100%;
      background: #000;
      border-radius: 15px;
      margin-top: 10px;
    }

    #callArea {
      display: none;
    }

    #status {
      color: #22c55e;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>📹 Home Call</h1>

  <p id="status">
    Siap melakukan panggilan
  </p>

  <div class="card" id="home">

    <div class="icon">🏠</div>

    <h2 style="text-align:center;">
      Hubungi Pemilik
    </h2>

    <p style="text-align:center;margin-top:12px;color:#8b93a7;">
      Tekan tombol di bawah untuk melakukan
      video call.
    </p>

    <button class="blue" onclick="startCall()">
      📞 Mulai Video Call
    </button>

  </div>


  <div class="card" id="callArea">

    <h2>🎥 Video Call</h2>

    <video id="remoteVideo"
           autoplay
           playsinline></video>

    <video id="localVideo"
           autoplay
           muted
           playsinline></video>

    <button class="red" onclick="endCall()">
      🔴 Akhiri Panggilan
    </button>

  </div>

</div>


<script>

  let peer;
  let currentCall = null;
  let localStream = null;

  // ID TAMU dibuat otomatis
  peer = new Peer();


  peer.on("open", function(id) {

    document.getElementById("status").textContent =
      "🟢 Siap menelepon";

  });


  async function startCall() {

    try {

      localStream =
        await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true
        });

      document.getElementById("localVideo").srcObject =
        localStream;


      // ID PEMILIK
      currentCall =
        peer.call(
          "homecall-owner-2026",
          localStream
        );


      document.getElementById("home").style.display =
        "none";

      document.getElementById("callArea").style.display =
        "block";

      document.getElementById("status").textContent =
        "📞 Memanggil pemilik...";


      currentCall.on("stream", function(remoteStream) {

        document.getElementById("remoteVideo").srcObject =
          remoteStream;

        document.getElementById("status").textContent =
          "🟢 Terhubung";

      });


      currentCall.on("close", function() {

        endCall();

      });


    } catch (error) {

      alert(
        "Kamera atau mikrofon tidak bisa digunakan."
      );

    }

  }


  function endCall() {

    if (currentCall) {

      currentCall.close();
      currentCall = null;

    }


    if (localStream) {

      localStream.getTracks().forEach(function(track) {
        track.stop();
      });

      localStream = null;

    }


    document.getElementById("remoteVideo").srcObject =
      null;

    document.getElementById("localVideo").srcObject =
      null;

    document.getElementById("callArea").style.display =
      "none";

    document.getElementById("home").style.display =
      "block";

    document.getElementById("status").textContent =
      "Siap melakukan panggilan";

  }

</script>

</body>
</html>
