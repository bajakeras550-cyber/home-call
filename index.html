<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Home Call</title>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080b12;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      padding: 25px 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .status {
      color: #22c55e;
      font-size: 13px;
    }

    .welcome {
      margin-top: 70px;
    }

    .welcome small {
      color: #8b93a7;
      font-size: 15px;
    }

    .welcome h1 {
      margin-top: 10px;
      font-size: 38px;
      line-height: 1.1;
    }

    .welcome p {
      margin-top: 15px;
      color: #8b93a7;
      line-height: 1.6;
    }

    .call-card {
      margin-top: 45px;
      padding: 25px;
      background: #111722;
      border: 1px solid #202938;
      border-radius: 25px;
    }

    .icon {
      height: 180px;
      background: #080b12;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 65px;
      margin-bottom: 22px;
    }

    .call-card h2 {
      font-size: 21px;
    }

    .call-card p {
      color: #7f899d;
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.5;
    }

    .call-button {
      width: 100%;
      padding: 17px;
      margin-top: 22px;
      border: none;
      border-radius: 15px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .call-button:active {
      transform: scale(0.97);
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .feature {
      padding: 15px 8px;
      text-align: center;
      background: #111722;
      border: 1px solid #202938;
      border-radius: 16px;
    }

    .feature span {
      font-size: 23px;
    }

    .feature p {
      margin-top: 7px;
      font-size: 11px;
      color: #8b93a7;
    }

    #callArea {
      display: none;
    }

    video {
      width: 100%;
      background: #000;
      border-radius: 15px;
      margin-top: 10px;
      transform: none;
    }

    .end-button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: none;
      border-radius: 15px;
      background: #dc2626;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .footer {
      margin-top: 35px;
      text-align: center;
      color: #596275;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="top">

    <div class="logo">
      Home Call
    </div>

    <div class="status" id="status">
      🟢 Online
    </div>

  </div>

  <div id="home">

    <section class="welcome">

      <small>
        Selamat datang 👋
      </small>

      <h1>
        Hubungi<br>
        saya sekarang.
      </h1>

      <p>
        Tekan tombol di bawah untuk
        memulai panggilan video.
      </p>

    </section>

    <section class="call-card">

      <div class="icon">
        📹
      </div>

      <h2>
        Video Call
      </h2>

      <p>
        Hubungkan kamera dan mikrofon
        untuk melakukan panggilan video.
      </p>

      <button
        class="call-button"
        onclick="startCall()">

        📞 Mulai Video Call

      </button>

    </section>

    <section class="features">

      <div class="feature">
        <span>🎥</span>
        <p>Video</p>
      </div>

      <div class="feature">
        <span>🎙️</span>
        <p>Audio</p>
      </div>

      <div class="feature">
        <span>🔒</span>
        <p>Aman</p>
      </div>

    </section>

  </div>

  <div class="call-card" id="callArea">

    <h2>
      🎥 Video Call
    </h2>

    <video
      id="remoteVideo"
      autoplay
      playsinline>
    </video>

    <video
      id="localVideo"
      autoplay
      muted
      playsinline>
    </video>

    <button
      class="end-button"
      onclick="endCall()">

      🔴 Akhiri Panggilan

    </button>

  </div>

  <div class="footer">
    Home Call • Video Communication
  </div>

</div>

<script>

  let peer;
  let currentCall = null;
  let localStream = null;

  peer = new Peer({
    debug: 3,
    config: {
      iceServers: [
        {
          urls: "stun:stun.l.google.com:19302"
        }
      ]
    }
  });

  peer.on("open", function(id) {

    document.getElementById("status").textContent =
      "🟢 Online";

  });

  peer.on("error", function(error) {

    console.log(error);

    document.getElementById("status").textContent =
      "🔴 Koneksi bermasalah";

    alert(
      "Koneksi gagal: " + error.type
    );

  });

  async function startCall() {

    try {

      localStream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: "user"
            }
          },
          audio: true
        });

      const localVideo =
        document.getElementById("localVideo");

      localVideo.srcObject = localStream;

      await localVideo.play().catch(function() {});

      currentCall =
        peer.call(
          "homecall-owner-2026",
          localStream
        );

      document.getElementById("home").style.display =
        "none";

      document.getElementById("callArea").style.display =
        "block";

      document.getElementById("status").textContent =
        "📞 Memanggil...";

      currentCall.on("stream", function(remoteStream) {

        const remoteVideo =
          document.getElementById("remoteVideo");

        remoteVideo.srcObject = remoteStream;

        remoteVideo.play().catch(function() {});

        document.getElementById("status").textContent =
          "🟢 Terhubung";

      });

      currentCall.on("close", function() {

        endCall();

      });

      currentCall.on("error", function(error) {

        console.log(error);

        alert("Panggilan gagal.");

        endCall();

      });

    } catch (error) {

      console.log(error);

      alert(
        "Kamera atau mikrofon tidak bisa digunakan.\n\n" +
        error.message
      );

    }

  }

  function endCall() {

    if (currentCall) {

      currentCall.close();

      currentCall = null;

    }

    if (localStream) {

      localStream.getTracks().forEach(function(track) {

        track.stop();

      });

      localStream = null;

    }

    document.getElementById("localVideo").srcObject =
      null;

    document.getElementById("remoteVideo").srcObject =
      null;

    document.getElementById("callArea").style.display =
      "none";

    document.getElementById("home").style.display =
      "block";

    document.getElementById("status").textContent =
      "🟢 Online";

  }

</script>

</body>
</html>
