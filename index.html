<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Home Call</title>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080b12;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .status {
      color: #22c55e;
      margin-bottom: 20px;
    }

    .box {
      background: #111722;
      border: 1px solid #202938;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .id {
      word-break: break-all;
      background: #080b12;
      padding: 12px;
      border-radius: 10px;
      margin: 10px 0;
      color: #60a5fa;
    }

    input {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      margin: 8px 0;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      margin-top: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .blue {
      background: #2563eb;
      color: white;
    }

    .green {
      background: #16a34a;
      color: white;
    }

    .red {
      background: #dc2626;
      color: white;
    }

    video {
      width: 100%;
      background: #000;
      border-radius: 15px;
      margin-top: 10px;
    }

    #incoming {
      display: none;
      border: 1px solid #f59e0b;
    }

    #callArea {
      display: none;
    }

    #remoteVideo {
      min-height: 250px;
    }

    #localVideo {
      max-height: 220px;
    }

    .small {
      color: #8b93a7;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>📹 Home Call</h1>
  <div class="status" id="status">Menghubungkan...</div>

  <div class="box">
    <h2>👤 ID Kamu</h2>

    <div class="id" id="myId">
      Menunggu ID...
    </div>

    <button class="blue" onclick="copyId()">
      📋 Salin ID
    </button>

    <p class="small">
      Jika kamu adalah pemilik, kirim ID ini kepada tamu
      yang ingin melakukan video call.
    </p>
  </div>


  <div class="box">
    <h2>📞 Panggil Pemilik</h2>

    <input
      id="remoteId"
      type="text"
      placeholder="Masukkan ID pemilik"
    >

    <button class="green" onclick="startCall()">
      📞 Mulai Video Call
    </button>
  </div>


  <div class="box" id="incoming">

    <h2>📲 Panggilan Masuk!</h2>

    <p id="callerText">
      Seseorang sedang memanggil...
    </p>

    <button class="green" onclick="answerCall()">
      ✅ Terima
    </button>

    <button class="red" onclick="rejectCall()">
      ❌ Tolak
    </button>

  </div>


  <div class="box" id="callArea">

    <h2>🎥 Video Call</h2>

    <video
      id="remoteVideo"
      autoplay
      playsinline>
    </video>

    <video
      id="localVideo"
      autoplay
      muted
      playsinline>
    </video>

    <button class="red" onclick="endCall()">
      🔴 Akhiri Panggilan
    </button>

  </div>

</div>


<script>

  let peer;
  let localStream = null;
  let currentCall = null;
  let incomingCall = null;


  // Membuat ID otomatis
  peer = new Peer();


  peer.on("open", function(id) {

    document.getElementById("myId").textContent = id;

    document.getElementById("status").textContent =
      "🟢 Online";

  });


  // Kalau ada orang menelepon
  peer.on("call", function(call) {

    incomingCall = call;

    document.getElementById("incoming").style.display = "block";

    document.getElementById("callerText").textContent =
      "Panggilan dari ID: " + call.peer;

  });


  // Kalau terjadi error
  peer.on("error", function(error) {

    console.error(error);

    document.getElementById("status").textContent =
      "🔴 Terjadi masalah koneksi";

    alert("Koneksi gagal: " + error.type);

  });


  // Meminta kamera + mikrofon
  async function getCamera() {

    try {

      localStream =
        await navigator.mediaDevices.getUserMedia({

          video: true,
          audio: true

        });

      document.getElementById("localVideo").srcObject =
        localStream;

      return true;

    } catch (error) {

      alert(
        "Kamera atau mikrofon tidak bisa digunakan.\n\n" +
        error.message
      );

      return false;
    }
  }


  // Tamu menelepon pemilik
  async function startCall() {

    const remoteId =
      document.getElementById("remoteId").value.trim();

    if (!remoteId) {

      alert("Masukkan ID pemilik terlebih dahulu.");

      return;
    }


    const ready = await getCamera();

    if (!ready) return;


    currentCall =
      peer.call(remoteId, localStream);


    setupCall(currentCall);

  }


  // Pemilik menerima panggilan
  async function answerCall() {

    if (!incomingCall) return;


    const ready = await getCamera();

    if (!ready) return;


    incomingCall.answer(localStream);

    currentCall = incomingCall;

    incomingCall = null;

    document.getElementById("incoming").style.display =
      "none";

    setupCall(currentCall);

  }


  // Menyiapkan video panggilan
  function setupCall(call) {

    document.getElementById("callArea").style.display =
      "block";


    call.on("stream", function(remoteStream) {

      document.getElementById("remoteVideo").srcObject =
        remoteStream;

    });


    call.on("close", function() {

      endCall();

    });


    call.on("error", function(error) {

      console.error(error);

      alert("Panggilan gagal.");

      endCall();

    });

  }


  // Tolak panggilan
  function rejectCall() {

    if (incomingCall) {

      incomingCall.close();

      incomingCall = null;

    }

    document.getElementById("incoming").style.display =
      "none";

  }


  // Akhiri panggilan
  function endCall() {

    if (currentCall) {

      currentCall.close();

      currentCall = null;

    }


    if (localStream) {

      localStream.getTracks().forEach(function(track) {

        track.stop();

      });

      localStream = null;

    }


    document.getElementById("localVideo").srcObject =
      null;

    document.getElementById("remoteVideo").srcObject =
      null;

    document.getElementById("callArea").style.display =
      "none";

  }


  // Salin ID
  function copyId() {

    const id =
      document.getElementById("myId").textContent;

    if (!id || id === "Menunggu ID...") {

      alert("Tunggu sampai ID muncul.");

      return;

    }


    navigator.clipboard.writeText(id);

    alert("ID berhasil disalin!");

  }

</script>

</body>
</html>
